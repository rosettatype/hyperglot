name: Waiwai
note: 'Alternative names in the original submission: Wai-Wai, Uaiuai, Uaieue, Ouayeone. Glottocode: waiw1244. Family: Cariban (Karib), subgroup Parukotoan. The speaker date is approximate (~2000). The original submission notes historical missionary influence on the orthography and later homogenization, especially through Bible translation.'
