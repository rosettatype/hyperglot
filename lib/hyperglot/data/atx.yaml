note: 'Alternative names listed in the original submission: Anake, Aoaqui, Auakê, Auaqué, Awaikê, Awaké, Oewaku, Orotani, Uruak, Urutaní. The source reports 4 speakers in Brazil and 16 in Venezuela; speakers_date was not specified.'
